name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/ai_knowledge

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_knowledge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_knowledge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: Run Mypy
        run: python -m mypy app

      - name: Verify database migrations
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Run unit and contract tests
        run: python -m pytest tests/unit tests/contract

      - name: Run PostgreSQL integration tests
        run: python -m pytest tests/integration

      - name: Verify dependency consistency
        run: python -m pip check
